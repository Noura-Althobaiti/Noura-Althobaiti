<?xml version="1.0" encoding="UTF-8"?>

<svg width="1600" height="500"
     viewBox="0 0 1600 500"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background gradient -->
    <linearGradient id="gradient"
                    x1="0%" y1="100%"
                    x2="0%" y2="0%">

          <!-- Transparent at the very bottom -->
          <stop offset="0%"   stop-color="#4C1D95" stop-opacity="0"/>
          <!-- Gradually bring the dark color in -->
          <stop offset="25%"   stop-color="#4C1D95" stop-opacity="0.25"/>
          <stop offset="50%"  stop-color="#4C1D95" stop-opacity="0.5"/>
          <stop offset="75%"  stop-color="#4C1D95" stop-opacity="0.75"/>
          <!-- Fully visible at the top -->
          <stop offset="100%" stop-color="#4C1D95" stop-opacity="1"/>

    </linearGradient>

    <!-- Typing clip -->
    <clipPath id="typingClip">

      <rect x="430" y="190"
            width="0"
            height="80">

        <animate
          attributeName="width"
          from="0"
          to="760"
          dur="2s"
          begin="0s"
          fill="freeze"/>

      </rect>

    </clipPath>

  </defs>

  <!-- Background -->
  <rect
    width="1600"
    height="500"
    fill="url(#gradient)"/>

  <!-- Everything types together -->
  <g clip-path="url(#typingClip)">

    <text
      x="430"
      y="265"
      font-family="Fira Code, monospace"
      font-size="48"
      font-weight="600"
      fill="#E6EDF3">

      &gt; Hi there, I'm Noura 👋

    </text>

  </g>

</svg>
